<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../static/css/plantilla.css">
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <h2 class="text-center">NinjaTeam</h2>
        <nav class="nav flex-column">
            <a class="nav-link" href="#"><i class="fas fa-home"></i> Dashboard</a>
            <a class="nav-link" href="#"><i class="fas fa-icons"></i> Icons</a>
            <a class="nav-link" href="#"><i class="fas fa-layer-group"></i> Widgets</a>
            <!-- Agregar más enlaces -->
        </nav>
    </div>
    <div class="header d-flex justify-content-between align-items-center">
        <span class="menu-toggle"><i class="fas fa-bars"></i></span>
        <div class="icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-bell"></i>
            <i class="fas fa-power-off"></i>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div class="main-content">
        <!-- Header -->

        <!-- Contenido dinámico (como gráficas y tarjetas) -->
        <div class="container-fluid p-4">
            <div class="row">

                <!-- Gráfica -->
                <div class="chart-container">
                    <h5 class="text-center">Actividad</h5>
                    <canvas id="myChart"></canvas>
                </div>
                <!-- Script para la gráfica -->
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                <script>
                    const ctx = document.getElementById('myChart').getContext('2d');
                    const myChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['2008', '2009', '2010', '2011', '2012', '2013', '2014', '2015', '2016'],
                            datasets: [{
                                label: 'Proyectos',
                                data: [8, 7, 5, 6, 5, 6, 7, 8, 9],
                                borderColor: 'rgba(255, 99, 132, 1)',
                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                </script>
                <div class="col-md-4">
                    <div class="project-box">
                        <h5>Proyectos</h5>
                        <p>837 Proyectos</p>
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 53%;" aria-valuenow="53"
                                aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <p class="details">53%</p>
                    </div>
                    <div class="project-box">
                        <h5>Uso de Memoria</h5>
                        <p>804 Uso de disco</p>
                        <div class="progress">
                            <div class="progress-bar bg-info" role="progressbar" style="width: 76%;" aria-valuenow="76"
                                aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <p class="details">76%</p>
                    </div>
                    <div class="project-box">
                        <h5>Ventas Mensuales</h5>
                        <p>3922 Ventas</p>
                        <div class="progress">
                            <div class="progress-bar bg-success" role="progressbar" style="width: 94%;"
                                aria-valuenow="94" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <p class="details">94%</p>
                    </div>
                </div>

                <!-- Agregar más tarjetas y contenido aquí -->
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
