<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros de Alquileres</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Registros de Alquileres</h1>
    <table>
        <thead>
            <tr>
                <th>Fecha Fin</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            {% for registro in registros %}
            <tr>
                <td>{{ registro[0] }}</td>
                <td>{{ registro[1] }}</td>
            </tr>
            {% endfor %}
            <tr>
                <td><strong>Suma Total</strong></td>
                <td><strong>{{ suma_total }}</strong></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
