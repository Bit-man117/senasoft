    table {

      width: 100%;
    }

    th,

      border: 1px solid #dddddd;
      text-align: left;

  <!-- ventana container emergente -->

  <header>
    <div class="header">

      <div class="header-img">
        <img id="logosena" src="{{ url_for('static', filename='images/Logo-de-SENA-png-verde copia.png') }}"
          alt="Logo SENA">
        <a href="{{ url_for('coordinador') }}"><label id="nombre_instructor">{{ usuario_nombre }}</label></a>

      </div>

      <div class="header-navbar">

        <h2>RETARDO DE APRENDICES</h2>
        <style>
          .header-navbar {
            display: flex;
            color: white;
            justify-content: right;
            padding-right: 2%;
            align-items: center;
            width: 40%;
            height: 0px;
            /* background-color: rgb(255, 255, 0); */
          }
        </style>

      </div>

    </div>

    {% include 'menucoordinador.html' %}



    <div class="contenedor2">
      <div class="form">

        <div class="cuerpo">
          <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.css">

          <!-- JavaScript de jQuery (necesario para DataTables) -->
          <script type="text/javascript" charset="utf8" src="https://code.jquery.com/jquery-3.5.1.js"></script>
    
          <!-- JavaScript de DataTables -->
          <script type="text/javascript" charset="utf8"
            src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.js"></script>
    
          <script type="text/javascript">
            $(document).ready(function () {
              $('#tabla-permisos').DataTable({
                "language": {
                  "lengthMenu": "Mostrar _MENU_ registros por página",
                  "zeroRecords": "No se encontraron registros",
                  "info": "Mostrando página _PAGE_ de _PAGES_",
                  "infoEmpty": "No hay registros disponibles",
                  "infoFiltered": "(filtrado de _MAX_ registros totales)",
                  "search": "Buscar:",
                  "paginate": {
                    "first": "Primero",
                    "last": "Último",
                    "next": "Siguiente",
                    "previous": "Anterior"
                  },
                },
                "lengthMenu": [[10, 25, 50, -1], [10, 25, 50, "Todos"]],
                "pageLength": 10,
                // Permite el desplazamiento horizontal
    
                "scrollY": "calc(80vh - 100px)", // Fija la altura del área de desplazamiento
                "pagingType": "full_numbers" // Muestra todas las paginaciones disponibles
              });
            });
    
          </script>

          <table id="tabla-permisos">
            <thead>
              <tr>
                <th id="num">N°</th>
                <th id="ids">Documento</th>
                <th id="nick">Nombre</th>
                <th id="fich">Ficha</th>
                <th id="hrs">Fecha Ingreso</th>
                <th id="tipo">Retraso</th>
                <th>Observación</th>
              </tr>
            </thead>
            <tbody>
              {% for resultado in resultados %}
              <tr>
                <td id="num">{{ resultado[0] }}</td>
                <td id="ids">{{ resultado[2] }}</td>
                <td id="nick">{{ resultado[5] }}</td>
                <td id="fich">{{ resultado[6] }}</td>
                <td id="hrs">{{ resultado[1] }}</td>
                <td id="tipo">{{ resultado[4] }}</td>
                <td>{{ resultado[3] }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
