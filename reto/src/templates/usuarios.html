<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../static/css/users.css">
    <link rel="stylesheet" href="../static/css/root.css">
    <link rel="icon" href="../static/img/logosenanegro.svg" type="image/png">
    <link rel="shortcut icon" href="../static/img/logosenanegro.svg" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>
    {% include 'sidernavadmin.html' %}
    <script>
        function filterGallery() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const galleryItems = document.querySelectorAll('.gallery-item');
            let hasResults = false; // Variable para controlar si hay resultados

            galleryItems.forEach(item => {
                const description = item.querySelector('.description').textContent.toLowerCase();
                if (description.includes(filter)) {
                    item.style.display = ''; // Muestra el elemento
                    hasResults = true; // Hay al menos un resultado
                } else {
                    item.style.display = 'none'; // Oculta el elemento
                }
            });

            // Muestra o oculta el mensaje de "No existen resultados"
            const noResults = document.getElementById('noResults');
            noResults.style.display = hasResults ? 'none' : 'block';
        }


    </script>
    <!-- Contenido Principal -->
    <div class="contents">

        <div class="gallery">
            {% for bici in bicis %}
            <div class="gallery-item active">
                <img src="data:image/jpeg;base64,{{ bici[6] }}" alt="{{ bici[1] }}" class="img-fluid">
                <p class="description">{{ bici[1] }}</p>
                <p class="description">Price: ${{ bici[3] }}</p>
                <button class="solicitar-btn btn btn-primary"
                    onclick="alquilarBicicleta({{ bici[0] }})">Rent</button> <!-- ID de la bicicleta -->
            </div>
            {% endfor %}
        </div>

        <div id="noResults" style="display: none; margin-top: 20px;">No existen resultados.</div>
    </div>

    <script>
        function alquilarBicicleta(idBicicleta) {
            fetch('/alquilar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ id_bicicleta: idBicicleta }),
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error en la solicitud');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Éxito',
                            text: '¡Bicicleta alquilada exitosamente!',
                        }).then(() => {
                            location.reload();
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'Error: ' + data.message,
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Hubo un problema',
                        text: 'Hubo un problema al alquilar la bicicleta.',
                    });
                });
        }
    </script>
    



    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
