</head>


<body>

    <script>
        {% with messages = get_flashed_messages(with_categories = true) %}
        {% if messages %}
        {% for category, message in messages %}
        Swal.fire({
            title: "{{ message }}",
            icon: "{{ category }}"
        });
        {% endfor %}
        {% endif %}
        {% endwith %}
    </script>
    <!-- ------------------------- -->


    <div class="sect-izquierda">


        <div class="gallery">
            {% for evento in info %}
            <div class="gallery-item {% if loop.index <= 3 %}active{% endif %}">
                <img src="data:image/jpeg;base64,{{ evento[3] }}" alt="{{ evento[1] }}" class="evento-foto">
                <!-- Foto del evento en base64 -->
                <p class="description">{{ evento[1] }}: {{ evento[2] }}</p> <!-- Nombre y fecha del evento -->
                <button class="solicitar-btn">See More</button> <!-- Botón para solicitar -->
            </div>
            {% endfor %}

        </div>



        <div id="map"></div>

        <!-- Modal para mostrar el mapa completo -->
        <div id="myModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="fullMap"></div>
            </div>
        </div>

        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>






    </div>

    <div class="sect-derecha">
        <a href="{{ url_for('disponibles') }}" class="btn-permisos">Watch Available bikes</a>
        <a href="#" class="consultar-permiso btn-consulta">Watch  regional Centers</a>

        <div class="container">
            <h1>Welcome</h1>
            <form action="/login" id="login-form" method="POST">
                <div class="form-login">
                    <label for="usernames">User</label>
                    <input type="number" id="username" name="usuario" placeholder="Write Your User" required>
                </div>
                <div class="form-login">
                    <label for="passwords">Password</label>
                    <input type="password" id="password" name="password" placeholder="Write Your Password" required>
                </div>
                <div id="mensaje-error"></div>
                <input type="submit" value="Log In" class="btn">
            </form>
        </div>
        <footer class="footer">
